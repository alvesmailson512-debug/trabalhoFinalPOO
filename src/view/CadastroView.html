<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="container">
        <h2>CADASTRO DE USUÁRIO</h2>
        <div class="form-group">
            <label>Nome Completo:</label>
            <input type="text" required>
        </div>
        <div class="form-group">
            <label>E-mail:</label>
            <input type="email" required>
        </div>
        <div class="form-group">
            <label>Senha:</label>
            <input type="password" required>
        </div>
        <div class="form-group">
            <label>Tipo de Usuário:</label>
            <select>
                <option>Aluno</option>
                <option>Professor</option>
                <option>Coordenador</option>
            </select>
        </div>
        <ul class="menu-list">
            <li><a href="LoginView.html">1 - Finalizar Cadastro</a></li>
            <li><a href="MainMenuView.html" class="logout">2 - Voltar</a></li>
        </ul>
    </div>
</body>
</html>
